name: CI (Python)

on:
  push:
    branches: [main, 'release/v*']
    paths:
      - 'python/**'
      - 'version.json'
  pull_request:
    branches: [main, 'release/v*']
    paths:
      - 'python/**'
      - 'version.json'

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest --cov=fluent_cards --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: python/coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Install nbgv
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: pip install nbgv-python

      - name: Stamp version
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          VERSION=$(python -c "
          from nbgv_python.runner import NbgvRunner
          from nbgv_python.versioning import normalize_version_field
          ver = NbgvRunner().get_version()
          print(normalize_version_field(ver['semver2'], field='SemVer2'))
          ")
          echo "Stamping version: $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Build distribution
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          pip install build
          python -m build

      - name: Reset version
        if: always() && matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: git checkout -- pyproject.toml

      - name: Upload Python artifacts
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: python-dist
          path: python/dist/*
